<style>
:root{
  --paper:#FBFBFD; --surface:#FFFFFF; --sunk:#F2F2F5;
  --ink:#1D1D1F; --graphite:#6E6E73; --hair:#D9D9DE;
  --lux:#9A5B06; --lux-soft:#F6EAD6;
  --stage:#000000; --stage-ink:#F5F5F7; --stage-dim:#86868B; --stage-lit:#FFF4E0; --stage-lux:#F5B84A; --stage-hair:#2C2C2E;
  --btn:#1D1D1F; --btn-ink:#FFFFFF;
  --nav:rgba(251,251,253,.78);
  --radius-l:28px; --radius-m:18px;
  --gutter:clamp(16px,5vw,56px);
  --maxw:1180px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --arab:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#000000; --surface:#161618; --sunk:#1C1C1E;
    --ink:#F5F5F7; --graphite:#A1A1A6; --hair:#38383A;
    --lux:#F2B24C; --lux-soft:#2A2114;
    --stage:#161618; --stage-hair:#38383A;
    --btn:#F5F5F7; --btn-ink:#000000;
    --nav:rgba(0,0,0,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#000000; --surface:#161618; --sunk:#1C1C1E;
  --ink:#F5F5F7; --graphite:#A1A1A6; --hair:#38383A;
  --lux:#F2B24C; --lux-soft:#2A2114;
  --stage:#161618; --stage-hair:#38383A;
  --btn:#F5F5F7; --btn-ink:#000000;
  --nav:rgba(0,0,0,.72);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lux);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--hair)}
.nav-in{display:flex;align-items:center;gap:24px;height:64px;transition:height .3s}
.nav.scrolled .nav-in{height:52px}
.brand{font-weight:600;font-size:17px;text-decoration:none;letter-spacing:-.01em;white-space:nowrap;margin-right:auto}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--graphite);letter-spacing:0;line-height:1.1}
.links{display:flex;gap:22px;font-size:14px}
.links a{text-decoration:none;color:var(--graphite);transition:color .2s}
.links a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:none;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--graphite)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.burger{display:none;border:0;background:none;width:40px;height:40px;cursor:pointer;border-radius:10px;flex:none}
.burger span{display:block;width:18px;height:1.5px;background:var(--ink);margin:4px auto;transition:transform .25s}
.nav.open .burger span:first-child{transform:translateY(2.75px) rotate(45deg)}
.nav.open .burger span:last-child{transform:translateY(-2.75px) rotate(-45deg)}
.sheet{display:none}
@media (max-width:900px){
  .links{display:none}
  .burger{display:block}
  .sheet{display:block;overflow:hidden;max-height:0;transition:max-height .35s ease}
  .nav.open .sheet{max-height:420px}
  .sheet ul{display:grid;padding-block:8px 20px}
  .sheet a{display:block;padding:12px 0;font-size:22px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--hair)}
}

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s ease,background-color .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-primary:hover{opacity:.86}
.btn-ghost{border-color:var(--hair);background:transparent}
.btn-ghost:hover{background:var(--sunk)}
.btn-text{padding-inline:6px;color:var(--lux);font-weight:500}
.btn-text:hover{text-decoration:underline;text-underline-offset:4px}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- hero ---------- */
.hero{padding-block:clamp(36px,7vw,96px) clamp(8px,2vw,24px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);gap:clamp(32px,6vw,80px);align-items:center}
.hero h1{font-size:clamp(48px,8.4vw,108px);line-height:.96;letter-spacing:-.045em;font-weight:600}
.hero .hrole{margin-top:18px;font-size:clamp(22px,2.6vw,30px);font-weight:500;letter-spacing:-.02em}
.hero .tags{margin-top:8px;font-size:15px;color:var(--graphite)}
.hero .pitch{margin-top:24px;font-size:clamp(17px,1.5vw,19px);color:var(--graphite);max-width:34em}
.hero .pitch b{color:var(--ink);font-weight:500}
.hero .btns{margin-top:32px}
.portrait{position:relative;border-radius:var(--radius-l);overflow:hidden;aspect-ratio:4/5;background:var(--sunk);max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover}
.hero-anim{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-anim.d2{animation-delay:.12s}.hero-anim.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-anim{animation:none}}

.contact-strip{margin-top:clamp(40px,6vw,72px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hair)}
.cs-item{padding:20px 24px 4px 0}
.cs-item + .cs-item{padding-left:24px;border-left:1px solid var(--hair)}
.cs-label{font-size:13px;color:var(--graphite)}
.cs-value{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:19px;font-weight:500;letter-spacing:-.01em;flex-wrap:wrap}
.cs-value a{text-decoration:none;overflow-wrap:anywhere}
.cs-value a:hover{text-decoration:underline;text-underline-offset:4px}
.cs-note{margin-top:4px;font-size:14px;color:var(--graphite)}
.copy{border:1px solid var(--hair);background:none;border-radius:8px;height:28px;padding:0 9px;font-size:12px;cursor:pointer;color:var(--graphite)}
.copy:hover{color:var(--ink);background:var(--sunk)}
.msgr{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:500;text-decoration:none}
a.chip:hover{background:var(--hair)}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hero-photo{order:-1;max-width:360px}
  .contact-strip{grid-template-columns:1fr}
  .cs-item,.cs-item + .cs-item{padding:18px 0;border-left:0;border-bottom:1px solid var(--hair)}
}
@media (max-width:520px){ .hero-photo{max-width:260px} .hero .btns .btn{flex:1 1 auto} }

/* ---------- sections ---------- */
section{scroll-margin-top:56px}
.sec{padding-block:clamp(72px,10vw,140px)}
.sec + .sec{border-top:1px solid var(--hair)}
.sec-head{max-width:760px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head h2{font-size:clamp(34px,5vw,60px);line-height:1.04;letter-spacing:-.035em}
.sec-head p{margin-top:16px;font-size:clamp(18px,1.7vw,21px);color:var(--graphite);max-width:36em}

/* about */
.about-lead{font-size:clamp(26px,3.4vw,42px);line-height:1.18;letter-spacing:-.025em;font-weight:500;max-width:22em}
.about-grid{margin-top:clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.about-grid h3{font-size:15px;font-weight:600;margin-bottom:8px}
.about-grid p{font-size:16px;color:var(--graphite)}
@media (max-width:900px){.about-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.about-grid{grid-template-columns:1fr}}

/* results stage */
.stage{background:var(--stage);color:var(--stage-ink);padding-block:clamp(80px,11vw,150px)}
.stage .sec-head p{color:var(--stage-dim)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--stage-hair)}
.stat{padding:32px 24px 36px 0;border-bottom:1px solid var(--stage-hair)}
.stat:not(:nth-child(4n+1)){padding-left:24px;border-left:1px solid var(--stage-hair)}
.stat .v{font-size:clamp(44px,5.6vw,76px);line-height:1;letter-spacing:-.045em;font-weight:600;color:var(--stage-dim);transition:color 1.1s ease,text-shadow 1.4s ease;white-space:nowrap}
.stat .v small{font-size:.42em;letter-spacing:-.01em;font-weight:500;margin-left:.08em}
.stat .l{margin-top:14px;font-size:15px;line-height:1.45;color:var(--stage-ink)}
.stat .s{margin-top:6px;font-size:13px;color:var(--stage-dim)}
.stage.lit .stat .v{color:var(--stage-lit);text-shadow:0 0 28px rgba(245,184,74,.28)}
.stage.lit .stat:nth-child(2) .v{transition-delay:.08s}.stage.lit .stat:nth-child(3) .v{transition-delay:.16s}.stage.lit .stat:nth-child(4) .v{transition-delay:.24s}
.stage.lit .stat:nth-child(5) .v{transition-delay:.32s}.stage.lit .stat:nth-child(6) .v{transition-delay:.4s}.stage.lit .stat:nth-child(7) .v{transition-delay:.48s}.stage.lit .stat:nth-child(8) .v{transition-delay:.56s}
.quals{margin-top:48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.qual{padding-top:20px;border-top:2px solid var(--stage-lux)}
.qual h3{font-size:20px;letter-spacing:-.015em}
.qual p{margin-top:8px;color:var(--stage-dim);font-size:15px}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:not(:nth-child(4n+1)){padding-left:0;border-left:0}
  .stat:nth-child(2n){padding-left:20px;border-left:1px solid var(--stage-hair)}
}
@media (max-width:560px){.quals{grid-template-columns:1fr}.stat{padding-right:12px}.stat:nth-child(2n){padding-left:16px}}
@media (prefers-reduced-motion:reduce){.stat .v{transition:none}}

/* experience */
.role{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(20px,4vw,56px);padding-block:40px;border-top:1px solid var(--hair)}
.role:last-child{border-bottom:1px solid var(--hair)}
.period{font-size:15px;color:var(--graphite);padding-top:6px}
.period .now{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--lux);font-weight:500}
.period .now::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lux);box-shadow:0 0 0 3px var(--lux-soft)}
.role h3{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.025em;line-height:1.15}
.role .co{margin-top:6px;font-size:18px;font-weight:500}
.role .ind{margin-top:2px;font-size:15px;color:var(--graphite)}
.highlights{margin-top:22px;display:grid;gap:10px;max-width:46em}
.highlights li{position:relative;padding-left:22px}
.highlights li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--lux)}
.highlights b{font-weight:600}
details.more{margin-top:20px;max-width:52em}
details.more summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--lux);padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary .pm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:14px;line-height:1;transition:transform .25s}
details.more[open] summary .pm{transform:rotate(45deg)}
.groups{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 40px;padding:28px;background:var(--sunk);border-radius:var(--radius-m)}
.groups h4{margin:0 0 8px;font-size:14px;font-weight:600}
.groups li{font-size:15px;color:var(--graphite);padding-block:3px}
.groups li + li{border-top:1px solid var(--hair);padding-top:6px;margin-top:3px}
@media (max-width:760px){.role{grid-template-columns:1fr;gap:8px}.groups{grid-template-columns:1fr;padding:20px}}

.expo{margin-top:clamp(48px,7vw,96px)}
.expo-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:end}
.expo figure{margin:0;border-radius:var(--radius-l);overflow:hidden;background:var(--sunk)}
.expo figure img{width:100%;height:100%;object-fit:cover}
.expo .tall{aspect-ratio:4/5}
.expo .wide{aspect-ratio:4/3}
.expo-cap{margin-top:20px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px}
.expo-cap h3{font-size:22px;letter-spacing:-.02em}
.expo-cap p{color:var(--graphite);font-size:16px;max-width:34em}
@media (max-width:760px){.expo-grid,.expo-cap{grid-template-columns:1fr}.expo .tall{aspect-ratio:4/4.4}}

/* expertise */
.xp{border-top:1px solid var(--hair)}
.xp-card{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:baseline;padding-block:24px;border-bottom:1px solid var(--hair)}
.xp-card h3{font-size:clamp(20px,2vw,24px);letter-spacing:-.02em}
.xp-card ul{display:flex;flex-wrap:wrap;gap:8px}
.xp-card li{font-size:15px;padding:7px 14px;border-radius:999px;background:var(--sunk)}
@media (max-width:760px){.xp-card{grid-template-columns:1fr;gap:12px}}

.industries{margin-top:clamp(56px,7vw,88px)}
.industries h3.sub{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.025em;margin-bottom:20px}
.ind-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.ind-card{scroll-snap-align:start;padding:24px;border-radius:var(--radius-m);background:var(--sunk);display:flex;flex-direction:column;gap:8px;min-height:170px}
.ind-card h4{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.ind-card p{font-size:14px;color:var(--graphite)}
.ind-card .where{margin-top:auto;font-size:13px;color:var(--lux);font-weight:500}

/* value */
.value{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--hair)}
.val{padding:32px 28px 36px 0;border-bottom:1px solid var(--hair)}
.val:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--hair)}
.val h3{font-size:26px;letter-spacing:-.025em}
.val p{margin-top:10px;font-size:16px}
.val .ev{margin-top:12px;font-size:14px;color:var(--graphite)}
@media (max-width:900px){
  .value{grid-template-columns:repeat(2,minmax(0,1fr))}
  .val:not(:nth-child(3n+1)){padding-left:0;border-left:0}
  .val:nth-child(2n){padding-left:24px;border-left:1px solid var(--hair)}
}
@media (max-width:600px){.value{grid-template-columns:1fr}.val:nth-child(2n){padding-left:0;border-left:0}.val{padding-right:0}}

/* geography */
.geo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,72px)}
.geo-now{font-size:clamp(34px,4.4vw,54px);letter-spacing:-.035em;font-weight:600;line-height:1.05;margin-top:6px}
.k{font-size:14px;color:var(--graphite)}
.regions{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.region h3{font-size:15px;font-weight:600;color:var(--graphite);margin-bottom:10px}
.region li{font-size:clamp(20px,2vw,24px);font-weight:500;letter-spacing:-.015em;padding-block:6px;border-bottom:1px solid var(--hair)}
.langs li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px;padding-block:14px;border-bottom:1px solid var(--hair)}
.langs li:first-child{border-top:1px solid var(--hair)}
.langs .nm{font-size:clamp(22px,2.4vw,28px);font-weight:500;letter-spacing:-.02em}
.langs .nm{justify-self:start}
.langs .nm[lang="ar"]{font-family:var(--arab);letter-spacing:0}
.langs .lv{font-size:14px;color:var(--graphite);text-align:right}
.langs .lv b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.edu{margin-top:40px;display:grid;gap:14px}
.edu li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;font-size:15px}
.edu .y{color:var(--graphite)}
.edu span{color:var(--graphite)}
@media (max-width:760px){.geo{grid-template-columns:1fr}.regions{grid-template-columns:1fr}}

/* cv */
.cv-box{display:grid;gap:clamp(28px,4vw,48px);background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-l);padding:clamp(28px,5vw,64px)}
.cv-box h2{font-size:clamp(34px,4.6vw,56px);letter-spacing:-.035em;line-height:1.04}
.cv-box > div > p{margin-top:14px;color:var(--graphite);max-width:30em}
.cv-files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cv-file{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 18px;align-items:center;padding:22px;border-radius:var(--radius-m);background:var(--sunk)}
.cv-file .acts{grid-column:1/-1}
.cv-file .pdf{width:44px;height:56px;border-radius:6px;background:var(--surface);border:1px solid var(--hair);display:grid;place-items:end center;padding-bottom:6px;font-size:10px;font-weight:600;color:var(--lux)}
.cv-file .t{font-weight:600;font-size:19px;letter-spacing:-.01em}
.cv-file .m{font-size:13px;color:var(--graphite)}
.cv-file .acts{display:flex;gap:8px;flex-wrap:wrap}
.cv-file .btn{min-height:38px;padding:0 14px;font-size:14px}
@media (max-width:760px){.cv-files{grid-template-columns:1fr}}

/* contact */
.talk{text-align:left}
.talk h2{font-size:clamp(44px,7.6vw,104px);line-height:.98;letter-spacing:-.045em;max-width:12em}
.talk .lead{margin-top:22px;font-size:clamp(18px,1.8vw,22px);color:var(--graphite);max-width:32em}
.talk .btns{margin-top:36px}
.talk .contact-strip{margin-top:56px}

/* footer */
footer{border-top:1px solid var(--hair);padding-block:40px 48px;font-size:14px;color:var(--graphite)}
.foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.foot b{display:block;color:var(--ink);font-weight:600}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.copyline{margin-top:32px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:760px){.foot{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* dialog */
dialog.viewer{width:min(900px,100vw - 32px);max-height:calc(100dvh - 32px);padding:0;border:0;border-radius:var(--radius-m);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
dialog.viewer::backdrop{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.v-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.v-head b{margin-right:auto}
.v-tabs{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:2px}
.v-tabs button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--graphite)}
.v-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.v-close{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.v-body{overflow:auto;max-height:calc(100dvh - 32px - 60px);padding:16px;background:var(--sunk);display:grid;gap:12px}
.v-body img{width:100%;border-radius:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.v-head .btn{min-height:34px;padding:0 14px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

let LANG = "ru";
function initialLang(){
  const hsh = (location.hash || "").slice(1).toLowerCase();
  if (hsh === "en" || hsh === "ru") return hsh;
  try { const s = localStorage.getItem("imad-lang"); if (s === "en" || s === "ru") return s; } catch (e) {}
  return (navigator.language || "ru").toLowerCase().startsWith("ru") ? "ru" : "en";
}
function setLang(lang){
  if (lang === LANG) return;
  // keep the reader's place: remember the top-most visible section and its offset
  const navH = $("#nav").offsetHeight;
  const secs = [...document.querySelectorAll("#app > section")];
  const anchor = secs.find(s => s.getBoundingClientRect().bottom > navH + 4);
  const id = anchor && anchor.id, off = anchor ? anchor.getBoundingClientRect().top : 0;
  const ratio = anchor ? (navH - off) / Math.max(1, anchor.offsetHeight) : 0;
  const openMore = [...document.querySelectorAll("details.more[open]")].map(d => d.id);
  LANG = lang;
  render(lang);
  openMore.forEach(i => { const d = document.getElementById(i); if (d) d.open = true; });
  if (id) {
    const el = document.getElementById(id);
    const y = window.scrollY + el.getBoundingClientRect().top - navH + Math.max(0, ratio) * el.offsetHeight;
    window.scrollTo({ top: Math.max(0, y), behavior: "instant" });
  }
  try { localStorage.setItem("imad-lang", lang); } catch (e) {}
  try { history.replaceState(null, "", "#" + lang); } catch (e) {}
}

function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast(T[LANG].cs.copied + ": " + txt); }
  catch (e) { toast(txt); }
}

/* CV viewer + download */
let viewerLang = "ru";
function openViewer(k){
  viewerLang = k;
  $("#vBody").innerHTML = FILES[k].pages.map((p, i) => `<img src="${p}" alt="${esc(T[LANG].cv.vTitle)} ${k.toUpperCase()}, ${i + 1}/${FILES[k].pages.length}" loading="lazy">`).join("");
  document.querySelectorAll(".v-tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cv === k)));
  const d = $("#viewer");
  if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
  $("#vBody").scrollTop = 0;
}
let dlPromise = null;
function getDownloads(){
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function downloadCV(k){
  const f = FILES[k];
  const dl = await getDownloads();
  if (dl) {
    try {
      const blob = await (await fetch(f.pdf)).blob();
      await dl.save({ filename: f.name, data: blob });
      toast(T[LANG].cv.saved);
    } catch (e) {
      if (!e || e.code !== "declined") { toast(T[LANG].cv.failed); openViewer(k); }
    }
    return;
  }
  const a = document.createElement("a");
  a.href = f.pdf; a.download = f.name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

/* "lights on" for the results stage */
let io;
function observeStage(){
  const st = document.querySelector(".stage");
  if (!st) return;
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { st.classList.add("lit"); return; }
  if (io) io.disconnect();
  if (observeStage.done) { st.classList.add("lit"); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { st.classList.add("lit"); observeStage.done = true; io.disconnect(); } }), { threshold: .25 });
  io.observe(st);
}

document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]"); if (lb) { setLang(lb.dataset.lang); return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(cp.dataset.copy); return; }
  const vw = e.target.closest("[data-view]"); if (vw) { openViewer(vw.dataset.view); return; }
  const dl = e.target.closest("[data-dl]"); if (dl) { downloadCV(dl.dataset.dl); return; }
  const cvb = e.target.closest("[data-cv]"); if (cvb) { openViewer(cvb.dataset.cv); return; }
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    const id = a.getAttribute("href").slice(1);
    const el = id === "top" ? document.body : document.getElementById(id);
    if (el) { e.preventDefault(); closeMenu(); (id === "top" ? window.scrollTo({ top: 0, behavior: "smooth" }) : el.scrollIntoView({ behavior: "smooth", block: "start" })); }
  }
});
$("#vDownload").addEventListener("click", () => downloadCV(viewerLang));
$("#vClose").addEventListener("click", () => $("#viewer").close());
$("#viewer").addEventListener("click", e => { if (e.target.id === "viewer") $("#viewer").close(); });

const nav = $("#nav"), burger = $("#burger");
function closeMenu(){ nav.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); }
burger.addEventListener("click", () => { const o = nav.classList.toggle("open"); burger.setAttribute("aria-expanded", String(o)); });
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h === "en" || h === "ru") setLang(h); });

LANG = initialLang();
render(LANG);
getDownloads();
</script>
